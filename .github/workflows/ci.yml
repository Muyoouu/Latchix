name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: format, lint, test, audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11-05
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-deny

      - uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-audit

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features

      - name: Docs
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

      - name: Dependency policy
        run: cargo deny check

      - name: Advisory audit
        run: cargo audit

  secrets:
    name: secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/$archive" "$base/$archive"
          curl -fsSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/checksums.txt" \
            "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $archive$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose

  build-musl:
    name: static musl binary
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11-05
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake musl-tools nasm perl

      - name: Build
        run: cargo build --locked --release --target x86_64-unknown-linux-musl -p latchix-cli

      - name: Verify static link
        run: |
          file target/x86_64-unknown-linux-musl/release/latchix
          if ldd target/x86_64-unknown-linux-musl/release/latchix 2>&1 | grep -Eq 'not a dynamic executable|statically linked'; then
            echo "static binary confirmed"
          else
            ldd target/x86_64-unknown-linux-musl/release/latchix
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          name: latchix-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/latchix
          retention-days: 7
          if-no-files-found: error

  build-glibc:
    name: glibc binary
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-11-05
        with:
          toolchain: 1.99.1

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake nasm perl

      - name: Build
        run: cargo build --locked --release -p latchix-cli

      - name: Inspect
        run: file target/release/latchix

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        with:
          name: latchix-x86_64-unknown-linux-gnu
          path: target/release/latchix
          retention-days: 7
          if-no-files-found: error

  image:
    name: container smoke
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman info --format '{{.Host.Security.Rootless}}'

      - name: Build image
        run: podman build --format docker -t latchix:ci .

      - name: Prepare mounted config
        run: |
          mkdir -p .ci/data .ci/config
          ssh-keygen -t ed25519 -N '' -f .ci/config/host_ed25519_key
          cat > .ci/config/config.toml <<'EOF'
          [server]
          bind = "0.0.0.0:2222"
          host_keys = ["/etc/latchix/host_ed25519_key"]

          [api]
          tcp = "0.0.0.0:8080"

          [storage]
          backend = "local"
          root = "/var/lib/latchix/files"

          [database]
          url = "sqlite:///var/lib/latchix/latchix.db"
          busy_timeout_ms = 5000
          synchronous = "full"
          max_read_connections = 8

          [tenancy]
          default_slug = "default"

          [limits]
          max_sessions_per_user = 10
          max_connections_per_ip = 50

          [ui]
          enabled = false
          EOF

      - name: Run read-only container
        run: |
          podman run -d \
            --name latchix-ci \
            --read-only \
            --tmpfs /run \
            --tmpfs /tmp \
            --cap-drop=ALL \
            --security-opt=no-new-privileges \
            --userns=keep-id:uid=65532,gid=65532 \
            -p 8080:8080 \
            -v "$PWD/.ci/data:/var/lib/latchix:Z" \
            -v "$PWD/.ci/config:/etc/latchix:ro,Z" \
            latchix:ci

      - name: Verify process and health endpoint
        run: |
          sleep 3
          podman exec latchix-ci /usr/local/bin/latchix health --config /etc/latchix/config.toml
          curl --fail --retry 5 --retry-delay 1 http://127.0.0.1:8080/readyz
          test "$(podman inspect --format '{{.Config.User}}' latchix:ci)" = "65532:65532"

      - name: Container logs
        if: always()
        run: podman logs latchix-ci || true

      - name: Cleanup
        if: always()
        run: podman rm -f latchix-ci || true
