name: Bug report
description: Report a reproducible defect
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Follow SECURITY.md.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the observed behavior.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include commands, config shape, client, and relevant logs with secrets removed.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "0.1.0 or git SHA"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Fedora 44, x86_64, OpenSSH 10.2"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove secrets, tenant data, host keys, and tokens.
      render: text
