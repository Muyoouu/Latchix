name: Feature or design request
description: Propose a change in behavior or scope
title: "proposal: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem does this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Describe the behavior, API, or design you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - v0.1
        - v0.2
        - Later
        - Unsure
    validations:
      required: true

  - type: checkboxes
    id: terms
    attributes:
      label: Checks
      options:
        - label: This is not a security vulnerability.
          required: true
