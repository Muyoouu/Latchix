[package]
name = "latchix-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Command line interface for Latchix"
publish.workspace = true

[[bin]]
name = "latchix"
path = "src/main.rs"

[features]
default = []
ui = ["dep:latchix-ui"]

[lints]
workspace = true

[dependencies]
axum.workspace = true
clap.workspace = true
latchix-api.workspace = true
latchix-audit.workspace = true
latchix-sftp.workspace = true
latchix-store.workspace = true
latchix-ui = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
